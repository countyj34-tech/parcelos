<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F766E" />
    <title>ParcelOS — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Segoe UI, system-ui, sans-serif;
        background: #0f766e;
        color: #fff;
        padding: 24px;
      }
      .card {
        max-width: 400px;
        text-align: center;
      }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { margin: 0 0 20px; opacity: 0.9; line-height: 1.45; }
      a, button {
        display: inline-block;
        margin: 4px;
        padding: 12px 18px;
        border-radius: 12px;
        border: 0;
        background: #fff;
        color: #0f766e;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>ParcelOS</h1>
      <p>The app is open without internet. Lists will update when the phone has data again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
      <a href="/app">Open desk</a>
      <a href="/login">Sign in</a>
    </div>
  </body>
</html>
