# ParcelOS — Supabase local development configuration
# https://supabase.com/docs/guides/cli/config

project_id = "parcelos"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**", "http://localhost:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Keep false for instant company signup (no confirm-email click).
# Hosted project: also turn OFF Authentication → Providers → Email → Confirm email.
enable_confirmations = false

[edge_runtime]
enabled = true

# Deploy & schedule (hosted):
#   supabase functions deploy signup-courier create-genesyspay-checkout genesyspay-webhook send-sms subscription-validation
#   Cron subscription-validation hourly with header x-cron-secret = CRON_SECRET
# Secrets:
#   GENESYSPAY_PUBLIC_KEY, GENESYSPAY_PRIVATE_KEY, GENESYSPAY_WEBHOOK_SECRET
#   APP_URL (e.g. https://your-app.lovable.app)
#   RESEND_API_KEY, RESEND_FROM_EMAIL (optional congrats email after signup)
#   CRON_SECRET, AT_*/TWILIO_* (company customer SMS — optional)
